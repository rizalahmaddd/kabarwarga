        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin · Kabar]
      summary: Ubah kabar
      description: 'Kalau mengunggah gambar, kirim `POST` + `_method=PUT` sebagai multipart. Slug dibuat ulang kalau judul berubah.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PostInput' }
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
