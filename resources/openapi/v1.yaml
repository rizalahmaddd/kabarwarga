    post:
      tags: [Admin · Rekening]
      summary: Tambah rekening atau QRIS
      requestBody: { $ref: '#/components/requestBodies/BankAccountInput' }
      responses:
        '201': { $ref: '#/components/responses/BankAccountResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/bank-accounts/{bankAccount}:
    parameters:
      - { name: bankAccount, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Admin · Rekening]
      summary: Detail rekening
      responses:
        '200': { $ref: '#/components/responses/BankAccountResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin · Rekening]
      summary: Ubah rekening
      description: 'Kalau mengunggah QRIS, kirim `POST` + `_method=PUT` sebagai multipart.'
      requestBody: { $ref: '#/components/requestBodies/BankAccountInput' }
      responses:
        '200': { $ref: '#/components/responses/BankAccountResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin · Rekening]
      summary: Hapus rekening beserta gambar QRIS-nya
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/settings:
    get:
      tags: [Admin · Pengaturan & Pengurus]
      summary: Pengaturan situs
      responses:
        '200':
          description: Pengaturan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Admin · Pengaturan & Pengurus]
      summary: Ubah pengaturan situs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_name]
              properties:
                site_name: { type: string, maxLength: 80 }
                site_tagline: { type: string, maxLength: 160 }
                address: { type: string, maxLength: 255 }
                treasurer_contact: { type: string, maxLength: 160 }
                payment_info: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Settings' }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/password:
    put:
      tags: [Admin · Pengaturan & Pengurus]
      summary: Ganti kata sandi sendiri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users:
    get:
      tags: [Admin · Pengaturan & Pengurus]
      summary: Daftar pengurus
      responses:
        '200':
          description: Daftar pengurus
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin · Pengaturan & Pengurus]
      summary: Tambah pengurus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 160 }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/{user}:
    delete:
      tags: [Admin · Pengaturan & Pengurus]
      summary: Cabut akses pengurus
      description: Token API-nya ikut dicabut. 409 kalau mencoba menghapus akun sendiri.
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token dari `POST /auth/login`.

  parameters:
    Page:
      { name: page, in: query, schema: { type: integer, minimum: 1 } }
    PerPage:
      { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: 'Maks 50 untuk daftar kabar warga.' }
    PostCategory:
      { name: category, in: query, schema: { $ref: '#/components/schemas/PostCategory' } }
    Submission:
      { name: submission, in: path, required: true, schema: { type: integer }, description: ID bukti bayar (bukan kode). }

  requestBodies:
    HouseholdInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [number, head_name]
            properties:
              number: { type: string, maxLength: 30, description: Nomor rumah (unik)., example: A-7 }
              head_name: { type: string, maxLength: 100 }
              phone: { type: string, maxLength: 30 }
              note: { type: string, maxLength: 1000 }
              is_active: { type: boolean }
    DuesTypeInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, amount, frequency]
            properties:
              name: { type: string, maxLength: 100 }
              amount: { type: integer, minimum: 0, maximum: 100000000, description: Nominal per periode dalam Rupiah. }
              frequency: { $ref: '#/components/schemas/Frequency' }
              starts_on: { type: string, pattern: '^\d{4}-\d{2}$', description: 'Khusus bulanan (YYYY-MM). Bulan sebelumnya tidak berlaku.' }
              due_on: { type: string, format: date, description: Khusus sekali bayar. }
              description: { type: string, maxLength: 1000 }
              is_active: { type: boolean }
    ExpenseInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [spent_on, description, amount]
            properties:
              spent_on: { type: string, format: date, description: Hari ini atau sebelumnya. }
              description: { type: string, maxLength: 255 }
              amount: { type: integer, minimum: 1, maximum: 100000000 }
    BankAccountInput:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [bank_name]
            description: Wajib isi `account_number` atau unggah gambar QRIS.
            properties:
              bank_name: { type: string, maxLength: 60, example: BCA }
              account_number: { type: string, maxLength: 60 }
              account_name: { type: string, maxLength: 100 }
              qris: { type: string, format: binary, description: 'Gambar, maks 3 MB.' }
              remove_qris: { type: boolean }
              position: { type: integer, minimum: 0, maximum: 999, description: Urutan tampil. }
              is_active: { type: boolean }

  responses:
    Message:
      description: Berhasil
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Unauthenticated. }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Conflict:
      description: Ditolak karena aturan bisnis
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: 'Rumah A-7 sudah punya catatan iuran, jadi tidak bisa dihapus. Nonaktifkan saja kalau sudah pindah.' }
    TooManyRequests:
      description: Terlalu banyak request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    RecordResult:
      description: Hasil pencatatan
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              created: { type: array, items: { type: string }, example: [Januari 2026, Februari 2026] }
              skipped: { type: array, items: { type: string } }
    SubmissionResult:
      description: Bukti bayar
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/PaymentSubmission' }
              message: { type: string }
    PostResult:
      description: Kabar
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Post' }
              message: { type: string }
    HouseholdResult:
      description: Rumah
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Household' }
              message: { type: string }
    DuesTypeResult:
      description: Jenis iuran
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/DuesType' }
              message: { type: string }
    ExpenseResult:
      description: Pengeluaran
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Expense' }
              message: { type: string }
    BankAccountResult:
      description: Rekening
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/BankAccount' }
              message: { type: string }

  schemas:
    Message:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string, example: Centang minimal satu bulan yang dibayar. }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          example: { periods: [Centang minimal satu bulan yang dibayar.] }
    Paginated:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: ['string', 'null'] }
            last: { type: ['string', 'null'] }
            prev: { type: ['string', 'null'] }
            next: { type: ['string', 'null'] }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: ['integer', 'null'] }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: ['integer', 'null'] }
            total: { type: integer }
    Settings:
      type: object
      properties:
        site_name: { type: string, example: RT 04 Griya Asri }
        site_tagline: { type: string }
        address: { type: string }
        treasurer_contact: { type: string }
        payment_info: { type: string }
    PostCategory:
      type: string
      enum: [pengumuman, berita, kegiatan, iuran]
    Frequency:
      type: string
      enum: [bulanan, sekali]
      description: '`bulanan` = tiap bulan, `sekali` = sekali bayar.'
    SubmissionStatus:
      type: string
      enum: [menunggu, diterima, ditolak]
    DuesStatus:
      type: string
      enum: [paid, pending, unpaid, not_applicable]
      description: '`paid` = lunas, `pending` = menunggu konfirmasi, `unpaid` = belum bayar, `not_applicable` = bulan sebelum iuran mulai berlaku (`starts_on`).'
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, description: Hanya untuk request yang login. }
        created_at: { type: string, format: date-time, description: Hanya untuk request yang login. }
    Post:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        category: { $ref: '#/components/schemas/PostCategory' }
        category_label: { type: string }
        excerpt: { type: string, description: 'Teks polos, maks 160 karakter.' }
        body: { type: string, description: Sumber Markdown. }
        body_html: { type: string, description: 'Markdown yang sudah dirender ke HTML (HTML mentah di-escape).' }
        image_url: { type: ['string', 'null'] }
        popup_image_url: { type: ['string', 'null'] }
        event_starts_at: { type: ['string', 'null'], format: date-time }
        event_location: { type: ['string', 'null'] }
        is_pinned: { type: boolean }
        is_popup: { type: boolean }
        is_published: { type: boolean }
        published_at: { type: ['string', 'null'], format: date-time }
        author: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PostInput:
      type: object
      required: [title, category, body, action]
      properties:
        title: { type: string, maxLength: 160 }
        category: { $ref: '#/components/schemas/PostCategory' }
        body: { type: string, maxLength: 20000, description: Markdown. }
        action: { type: string, enum: [publish, draft], description: '`draft` menurunkan dari tampilan warga; `publish` mempertahankan waktu terbit awal kalau sudah pernah terbit.' }
        event_starts_at: { type: string, format: date-time, description: Wajib kalau kategori `kegiatan`. }
        event_location: { type: string, maxLength: 160 }
        is_pinned: { type: boolean }
        is_popup: { type: boolean }
        image: { type: string, format: binary, description: 'Gambar, maks 3 MB (hanya multipart).' }
        remove_image: { type: boolean }
        popup_image: { type: string, format: binary, description: 'Gambar, maks 4 MB (hanya multipart).' }
        remove_popup_image: { type: boolean }
    Household:
      type: object
      properties:
        id: { type: integer }
        number: { type: string, example: A-7 }
        head_name: { type: string, example: Pak Budi }
        label: { type: string, example: A-7 · Pak Budi }
        is_active: { type: boolean }
        phone: { type: ['string', 'null'], description: Khusus pengurus. }
        note: { type: ['string', 'null'], description: Khusus pengurus. }
        payments_count: { type: integer, description: Khusus daftar/detail pengurus. }
    DuesType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: Iuran Keamanan }
        amount: { type: integer, example: 25000 }
        frequency: { $ref: '#/components/schemas/Frequency' }
