openapi: 3.1.0
info:
  title: Warga Update API
  version: 1.0.0
  description: |
    REST API for the Warga Update mobile app: public resident features (news, dues ledger, cashbook, online payment
    proof submission) and the admin panel for committee members (pengurus).

    ## Authentication
    Public endpoints need no authentication. Admin endpoints (`/admin/*`, `/auth/me`, `/auth/logout`) require a
    Sanctum personal access token obtained from `POST /auth/login`, sent as `Authorization: Bearer <token>`.

    ## Conventions
    - Always send `Accept: application/json`.
    - Money amounts are integers in Rupiah (no decimals).
    - Monthly periods use the format `YYYY-MM`. One-time dues have no period (`period: null`, `periods: []`).
    - Boolean form fields accept `true/false`, `1/0` or `"1"/"0"`. In `multipart/form-data` requests use `1` or `0`.
    - `PUT` requests that upload files (posts, bank accounts) must be sent as `POST` with `multipart/form-data` and an
      extra field `_method=PUT`, because PHP does not parse multipart bodies on real `PUT` requests.
    - On update, omitted boolean flags (`is_active`, `is_pinned`, `is_popup`) are treated as `false`, like the web form.

    ## Errors
    | Status | Meaning |
    |---|---|
    | 401 | Missing or invalid token |
    | 404 | Resource not found |
    | 409 | Business rule conflict, e.g. deleting a household that already has payments. Body: `{ "message": "..." }` |
    | 422 | Validation failed. Body: `{ "message": "...", "errors": { "field": ["..."] } }` |
    | 429 | Too many requests (login: 6/min, payment submission: 10/min) |
servers:
  - url: /api/v1
    description: Current host
tags:
  - name: Auth
  - name: Public
    description: Resident-facing endpoints, no login required.
  - name: Payment Submission
    description: Residents upload transfer proof; committee reviews it.
  - name: Admin · Payments
  - name: Admin · Submissions
  - name: Admin · Posts
  - name: Admin · Households
  - name: Admin · Dues Types
  - name: Admin · Expenses
  - name: Admin · Bank Accounts
  - name: Admin · Settings & Users

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and get an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email, example: bendahara@example.com }
                password: { type: string, example: rahasia123 }
                device_name: { type: string, maxLength: 100, description: 'Label for the token, e.g. the phone model., example: Pixel 8' }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: 1|q2w3e4r5t6y7u8i9o0 }
                  token_type: { type: string, example: Bearer }
                  user: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: The logged-in committee member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /home:
    get:
      tags: [Public]
      summary: Home screen feed
      description: Site settings, popup announcement, pinned posts, upcoming events, latest posts and this month's dues progress.
      security: []
      responses:
        '200':
          description: Home feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      settings: { $ref: '#/components/schemas/Settings' }
                      popup_post:
                        oneOf:
                          - $ref: '#/components/schemas/Post'
                          - type: 'null'
                      pinned: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      upcoming: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      latest: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      progress:
                        type: array
                        items:
                          type: object
                          properties:
                            dues_type: { $ref: '#/components/schemas/DuesType' }
                            label: { type: string, example: September 2026 }
                            paid: { type: integer, description: 'Active households that paid this period., example: 18' }
                            total: { type: integer, description: 'Number of active households., example: 32' }
  /settings:
    get:
      tags: [Public]
      summary: Site settings
      security: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Settings' }
  /posts:
    get:
      tags: [Public]
      summary: Published posts
      description: Pinned posts first, then newest.
      security: []
      parameters:
        - { $ref: '#/components/parameters/PostCategory' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      categories:
                        type: object
                        additionalProperties: { type: string }
                        example: { pengumuman: Pengumuman, berita: Berita, kegiatan: Kegiatan, iuran: Iuran }
        '422': { $ref: '#/components/responses/ValidationError' }
  /posts/{slug}:
    get:
      tags: [Public]
      summary: Post detail
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string }, example: kerja-bakti-minggu-ini }
      responses:
        '200':
          description: Post with up to 3 related posts of the same category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Post' }
                  related: { type: array, items: { $ref: '#/components/schemas/Post' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /households:
    get:
      tags: [Public]
      summary: Active households
      description: For the house picker in the pay form. Phone and notes are hidden.
      security: []
      responses:
        '200':
          description: Households
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Household' } }
  /dues-types:
    get:
      tags: [Public]
      summary: Active dues types
      security: []
      responses:
        '200':
          description: Dues types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DuesType' } }
  /bank-accounts:
    get:
      tags: [Public]
      summary: Active bank accounts / QRIS for transfers
      description: If the list is empty, online payment is closed.
      security: []
      responses:
        '200':
          description: Bank accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BankAccount' } }
  /dues/ledger:
    get:
      tags: [Public]
      summary: Dues ledger (who has paid)
      description: |
        For a monthly dues type, `rows[].months` holds 12 cells for the year.
        For a one-time dues type, each row carries a single cell's fields directly (`status`, `payment`, ...).
        Households listed are active ones plus inactive ones that have a payment for this type.
      security: []
      parameters:
        - { name: dues_type_id, in: query, schema: { type: integer }, description: Defaults to the first type. }
        - { name: year, in: query, schema: { type: integer }, description: Must be one of `years`; defaults to the current year. }
      responses:
        '200':
          description: Ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      dues_types: { type: array, items: { $ref: '#/components/schemas/DuesType' } }
                      dues_type:
                        oneOf:
                          - $ref: '#/components/schemas/DuesType'
                          - type: 'null'
                      years: { type: array, items: { type: integer }, example: [2026, 2025] }
                      year: { type: integer, example: 2026 }
                      months: { type: array, items: { type: string }, example: ['2026-01', '2026-02'] }
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            household: { $ref: '#/components/schemas/Household' }
                            months: { type: array, items: { $ref: '#/components/schemas/DuesCell' } }
                            period: { type: ['string', 'null'] }
                            period_label: { type: string }
                            status: { $ref: '#/components/schemas/DuesStatus' }
                            payment:
                              oneOf:
                                - $ref: '#/components/schemas/Payment'
                                - type: 'null'
  /dues/cashbook:
    get:
      tags: [Public]
      summary: Cashbook (money in and out per month)
      security: []
      parameters:
        - { name: year, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Cashbook
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      years: { type: array, items: { type: integer } }
                      year: { type: integer }
                      opening: { type: integer, description: Balance carried over from previous years. }
                      total_in: { type: integer }
                      total_out: { type: integer }
                      closing: { type: integer }
                      rows:
                        type: array
                        description: Only months that have movement.
                        items:
                          type: object
                          properties:
                            month: { type: string, example: '2026-09' }
                            month_label: { type: string, example: September 2026 }
                            in: { type: integer }
                            out: { type: integer }
                            balance: { type: integer }
                      expenses: { type: array, items: { $ref: '#/components/schemas/Expense' } }
  /households/{household}/dues/{duesType}:
    get:
      tags: [Public]
      summary: Payment state of a household for a dues type
      description: |
        Drives the pay form (which months can be ticked) and the admin "record payment" form.
        Only months with status `unpaid` can be submitted/recorded.
      security: []
      parameters:
        - { name: household, in: path, required: true, schema: { type: integer } }
        - { name: duesType, in: path, required: true, schema: { type: integer } }
        - { name: year, in: query, schema: { type: integer, minimum: 2000 }, description: Monthly types only; defaults to the current year. }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      household: { $ref: '#/components/schemas/Household' }
                      dues_type: { $ref: '#/components/schemas/DuesType' }
                      year: { type: ['integer', 'null'] }
                      months: { type: array, description: '12 cells for monthly types, empty otherwise.', items: { $ref: '#/components/schemas/DuesCell' } }
                      once:
                        description: The single cell for one-time types, null for monthly types.
                        oneOf:
                          - $ref: '#/components/schemas/DuesCell'
                          - type: 'null'
                      recent_submissions: { type: array, description: Last 5 submissions of this household., items: { $ref: '#/components/schemas/PaymentSubmission' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payment-submissions:
    post:
      tags: [Payment Submission]
      summary: Submit transfer proof
      description: |
        Residents send proof of a bank transfer. The committee then approves or rejects it.
        Months that are already paid or already waiting for review are refused with a 422 on `periods`.
        For one-time dues omit `periods`.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [household_id, dues_type_id, bank_account_id, proof]
              properties:
                household_id: { type: integer }
                dues_type_id: { type: integer }
                'periods[]':
                  type: array
                  maxItems: 24
                  items: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                  description: Required for monthly dues. Year must be within the last 5 years to next year.
                bank_account_id: { type: integer, description: The account the resident transferred to. }
                proof: { type: string, format: binary, description: 'jpg, jpeg, png, webp, heic or pdf; max 5 MB.' }
                payer_name: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 30 }
                note: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Submitted. Keep `data.code` to check the status later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentSubmission' }
                  message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /payment-submissions/{code}:
    get:
      tags: [Payment Submission]
      summary: Check a submission by its code
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: K7M2QX9P, description: Case-insensitive. }
      responses:
        '200':
          description: Submission
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentSubmission' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payments:
    get:
      tags: [Admin · Payments]
      summary: Recorded payments
      parameters:
        - { name: household_id, in: query, schema: { type: integer } }
        - { name: dues_type_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Paginated payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin · Payments]
      summary: Record a cash/transfer payment
      description: |
        `amount` is the total received; it is split evenly across the selected months (any remainder goes to the
        first months). Months already recorded are skipped and listed in `skipped`.
        Returns 201 when at least one month was recorded, 200 when everything was skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [household_id, dues_type_id, amount, paid_on, method]
              properties:
                household_id: { type: integer }
                dues_type_id: { type: integer }
                periods: { type: array, items: { type: string, example: '2026-09' }, description: Required for monthly dues. }
                amount: { type: integer, minimum: 0, maximum: 100000000 }
                paid_on: { type: string, format: date, description: Today or earlier. }
                method: { type: string, enum: [tunai, transfer] }
                note: { type: string, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/RecordResult' }
        '201': { $ref: '#/components/responses/RecordResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/payments/{payment}:
    delete:
      tags: [Admin · Payments]
      summary: Delete a payment record
      parameters:
        - { name: payment, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payment-submissions:
    get:
      tags: [Admin · Submissions]
      summary: Submissions by status
      description: Pending ones are sorted oldest first; reviewed ones newest review first. `counts` gives totals per status for tab badges.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SubmissionStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Paginated submissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PaymentSubmission' } }
                      counts:
                        type: object
                        properties:
                          menunggu: { type: integer }
                          diterima: { type: integer }
                          ditolak: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/payment-submissions/{submission}:
    get:
      tags: [Admin · Submissions]
      summary: Submission detail
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      responses:
        '200': { $ref: '#/components/responses/SubmissionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/payment-submissions/{submission}/proof:
    get:
      tags: [Admin · Submissions]
      summary: Download the proof file
      description: Streams the uploaded image or PDF. Needs the bearer token, so load it with an authenticated HTTP client rather than a plain image URL.
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      responses:
        '200':
          description: File
          content:
            image/*: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/payment-submissions/{submission}/approve:
    post:
      tags: [Admin · Submissions]
      summary: Approve (fully or partially)
      description: |
        Records a payment for each accepted month. Send the months you accept in `periods`; if fewer than submitted,
        `reject_reason` is required and the other months become payable again. One-time dues: omit `periods`.
        Months already recorded are not double counted (listed in `skipped`). 409 if already processed.
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paid_on]
              properties:
                paid_on: { type: string, format: date }
                periods: { type: array, items: { type: string } }
                reject_reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentSubmission' }
                  message: { type: string }
                  created: { type: array, items: { type: string }, example: [Januari 2026] }
                  skipped: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/payment-submissions/{submission}/reject:
    post:
      tags: [Admin · Submissions]
      summary: Reject
      description: The resident can submit again. 409 if already processed.
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reject_reason]
              properties:
                reject_reason: { type: string, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/SubmissionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/payment-submissions/{submission}/cancel:
    post:
      tags: [Admin · Submissions]
      summary: Undo an approval
      description: Deletes the payments created by the approval and moves the submission back to pending. Only for approved submissions (409 otherwise).
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      responses:
        '200':
          description: Undone
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentSubmission' }
                  message: { type: string }
                  removed_payments: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/payment-submissions/{submission}/reopen:
    post:
      tags: [Admin · Submissions]
      summary: Reopen a rejected submission
      description: Only for rejected submissions (409 otherwise).
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      responses:
        '200': { $ref: '#/components/responses/SubmissionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/posts:
    get:
      tags: [Admin · Posts]
      summary: All posts including drafts
      description: Drafts first, then newest published.
      parameters:
        - { $ref: '#/components/parameters/PostCategory' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Post' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin · Posts]
      summary: Create a post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PostInput' }
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201': { $ref: '#/components/responses/PostResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/posts/{post}:
    parameters:
      - { name: post, in: path, required: true, schema: { type: integer }, description: Post ID (not slug). }
    get:
      tags: [Admin · Posts]
      summary: Post detail
      responses:
        '200': { $ref: '#/components/responses/PostResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin · Posts]
      summary: Update a post
      description: 'With image uploads send `POST` + `_method=PUT` as multipart. The slug is regenerated when the title changes.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PostInput' }
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '200': { $ref: '#/components/responses/PostResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin · Posts]
      summary: Delete a post and its images
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/households:
    get:
      tags: [Admin · Households]
      summary: All households (with payment count)
      responses:
        '200':
          description: Households
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Household' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin · Households]
      summary: Add a household
      requestBody: { $ref: '#/components/requestBodies/HouseholdInput' }
      responses:
        '201': { $ref: '#/components/responses/HouseholdResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
