openapi: 3.1.0
info:
  title: Kabar Warga API
  version: 1.0.0
  description: |
    REST API untuk aplikasi mobile Kabar Warga: fitur warga (kabar, buku iuran, buku kas, kirim bukti bayar online)
    dan panel pengurus.

    ## Autentikasi
    Endpoint warga tidak perlu login. Endpoint pengurus (`/admin/*`, `/auth/me`, `/auth/logout`) butuh token Sanctum
    yang didapat dari `POST /auth/login`, dikirim lewat header `Authorization: Bearer <token>`.

    ## Aturan umum
    - Selalu kirim header `Accept: application/json`.
    - Nominal uang berupa bilangan bulat dalam Rupiah (tanpa desimal).
    - Periode bulanan memakai format `YYYY-MM`. Iuran sekali bayar tidak punya periode (`period: null`, `periods: []`).
    - Field boolean menerima `true/false`, `1/0`, atau `"1"/"0"`. Pada `multipart/form-data` pakai `1` atau `0`.
    - Request `PUT` yang mengunggah file (kabar, rekening) wajib dikirim sebagai `POST` `multipart/form-data` dengan
      tambahan field `_method=PUT`, karena PHP tidak membaca body multipart pada request `PUT` asli.
    - Saat update, flag boolean yang tidak dikirim (`is_active`, `is_pinned`, `is_popup`) dianggap `false`, sama seperti form web.

    ## Error
    | Status | Arti |
    |---|---|
    | 401 | Token tidak ada atau tidak valid |
    | 404 | Data tidak ditemukan |
    | 409 | Ditolak aturan bisnis, mis. menghapus rumah yang sudah punya catatan iuran. Body: `{ "message": "..." }` |
    | 422 | Validasi gagal. Body: `{ "message": "...", "errors": { "field": ["..."] } }` |
    | 429 | Terlalu banyak request (login: 6/menit, kirim bukti bayar: 10/menit) |
servers:
  - url: /api/v1
    description: Host saat ini
tags:
  - name: Autentikasi
    description: Login pengurus dan token API.
  - name: Warga
    description: Endpoint untuk warga, tanpa login.
  - name: Bukti Bayar
    description: Warga mengirim bukti transfer, pengurus mengeceknya.
  - name: Admin · Pembayaran
    description: Pencatatan iuran tunai/transfer oleh pengurus.
  - name: Admin · Konfirmasi Bayar
    description: Pemeriksaan bukti bayar yang dikirim warga.
  - name: Admin · Kabar
    description: Pengumuman, berita, kegiatan, dan info iuran.
  - name: Admin · Rumah
    description: Data rumah/kepala keluarga.
  - name: Admin · Jenis Iuran
    description: Iuran bulanan dan sekali bayar.
  - name: Admin · Pengeluaran
    description: Uang keluar dari kas.
  - name: Admin · Rekening
    description: Rekening bank dan QRIS tujuan transfer.
  - name: Admin · Pengaturan & Pengurus
    description: Pengaturan situs, kata sandi, dan akun pengurus.

paths:
  /auth/login:
    post:
      tags: [Autentikasi]
      summary: Login dan dapatkan token API
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email, example: bendahara@example.com }
                password: { type: string, example: rahasia123 }
                device_name: { type: string, maxLength: 100, description: 'Label token, mis. nama/model HP.', example: Pixel 8 }
      responses:
        '200':
          description: Token berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: 1|q2w3e4r5t6y7u8i9o0 }
                  token_type: { type: string, example: Bearer }
                  user: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/me:
    get:
      tags: [Autentikasi]
      summary: Pengurus yang sedang login
      responses:
        '200':
          description: Data pengurus
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Autentikasi]
      summary: Logout (cabut token yang sedang dipakai)
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /home:
    get:
      tags: [Warga]
      summary: Isi halaman beranda
      description: Pengaturan situs, pengumuman popup, kabar yang disematkan, kegiatan mendatang, kabar terbaru, dan progres iuran bulan ini.
      security: []
      responses:
        '200':
          description: Data beranda
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      settings: { $ref: '#/components/schemas/Settings' }
                      popup_post:
                        oneOf:
                          - $ref: '#/components/schemas/Post'
                          - type: 'null'
                      pinned: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      upcoming: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      latest: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      progress:
                        type: array
                        items:
                          type: object
                          properties:
                            dues_type: { $ref: '#/components/schemas/DuesType' }
                            label: { type: string, example: September 2026 }
                            paid: { type: integer, description: Jumlah rumah aktif yang sudah bayar periode ini., example: 18 }
                            total: { type: integer, description: Jumlah rumah aktif., example: 32 }
  /settings:
    get:
      tags: [Warga]
      summary: Pengaturan situs
      security: []
      responses:
        '200':
          description: Pengaturan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Settings' }
  /posts:
    get:
      tags: [Warga]
      summary: Daftar kabar yang sudah terbit
      description: Kabar yang disematkan tampil paling atas, lalu yang terbaru.
      security: []
      parameters:
        - { $ref: '#/components/parameters/PostCategory' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Kabar per halaman
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Post' } }
                      categories:
                        type: object
                        additionalProperties: { type: string }
                        example: { pengumuman: Pengumuman, berita: Berita, kegiatan: Kegiatan, iuran: Iuran }
        '422': { $ref: '#/components/responses/ValidationError' }
  /posts/{slug}:
    get:
      tags: [Warga]
      summary: Detail kabar
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string }, example: kerja-bakti-minggu-ini }
      responses:
        '200':
          description: Kabar beserta maksimal 3 kabar terkait dari kategori yang sama
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Post' }
                  related: { type: array, items: { $ref: '#/components/schemas/Post' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /households:
    get:
      tags: [Warga]
      summary: Daftar rumah aktif
      description: Untuk pilihan rumah di form bayar. Nomor HP dan catatan tidak ditampilkan.
      security: []
      responses:
        '200':
          description: Daftar rumah
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Household' } }
  /dues-types:
    get:
      tags: [Warga]
      summary: Daftar jenis iuran aktif
      security: []
      responses:
        '200':
          description: Jenis iuran
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DuesType' } }
  /bank-accounts:
    get:
      tags: [Warga]
      summary: Rekening / QRIS aktif untuk transfer
      description: Kalau daftarnya kosong, berarti pembayaran online sedang ditutup.
      security: []
      responses:
        '200':
          description: Daftar rekening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BankAccount' } }
  /dues/ledger:
    get:
      tags: [Warga]
      summary: Buku iuran (siapa yang sudah bayar)
      description: |
        Untuk iuran bulanan, `rows[].months` berisi 12 sel untuk tahun tersebut.
        Untuk iuran sekali bayar, setiap baris langsung memuat field sel (`status`, `payment`, dst).
        Rumah yang ditampilkan adalah rumah aktif ditambah rumah nonaktif yang punya catatan bayar untuk iuran ini.
      security: []
      parameters:
        - { name: dues_type_id, in: query, schema: { type: integer }, description: Bawaan jenis iuran pertama. }
        - { name: year, in: query, schema: { type: integer }, description: 'Harus salah satu dari `years`; bawaan tahun ini.' }
      responses:
        '200':
          description: Buku iuran
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      dues_types: { type: array, items: { $ref: '#/components/schemas/DuesType' } }
                      dues_type:
                        oneOf:
                          - $ref: '#/components/schemas/DuesType'
                          - type: 'null'
                      years: { type: array, items: { type: integer }, example: [2026, 2025] }
                      year: { type: integer, example: 2026 }
                      months: { type: array, items: { type: string }, example: ['2026-01', '2026-02'] }
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            household: { $ref: '#/components/schemas/Household' }
                            months: { type: array, items: { $ref: '#/components/schemas/DuesCell' } }
                            period: { type: ['string', 'null'] }
                            period_label: { type: string }
                            status: { $ref: '#/components/schemas/DuesStatus' }
                            payment:
                              oneOf:
                                - $ref: '#/components/schemas/Payment'
                                - type: 'null'
  /dues/cashbook:
    get:
      tags: [Warga]
      summary: Buku kas (uang masuk dan keluar per bulan)
      security: []
      parameters:
        - { name: year, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Buku kas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      years: { type: array, items: { type: integer } }
                      year: { type: integer }
                      opening: { type: integer, description: Saldo bawaan dari tahun-tahun sebelumnya. }
                      total_in: { type: integer }
                      total_out: { type: integer }
                      closing: { type: integer }
                      rows:
                        type: array
                        description: Hanya bulan yang ada transaksinya.
                        items:
                          type: object
                          properties:
                            month: { type: string, example: '2026-09' }
                            month_label: { type: string, example: September 2026 }
                            in: { type: integer }
                            out: { type: integer }
                            balance: { type: integer }
                      expenses: { type: array, items: { $ref: '#/components/schemas/Expense' } }
  /households/{household}/dues/{duesType}:
    get:
      tags: [Warga]
      summary: Status bayar satu rumah untuk satu jenis iuran
      description: |
        Dipakai untuk form bayar warga (bulan mana yang bisa dicentang) dan form catat pembayaran pengurus.
        Hanya bulan berstatus `unpaid` yang bisa dikirim/dicatat.
      security: []
      parameters:
        - { name: household, in: path, required: true, schema: { type: integer } }
        - { name: duesType, in: path, required: true, schema: { type: integer } }
        - { name: year, in: query, schema: { type: integer, minimum: 2000 }, description: 'Khusus iuran bulanan; bawaan tahun ini.' }
      responses:
        '200':
          description: Status bayar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      household: { $ref: '#/components/schemas/Household' }
                      dues_type: { $ref: '#/components/schemas/DuesType' }
                      year: { type: ['integer', 'null'] }
                      months: { type: array, description: '12 sel untuk iuran bulanan, kosong untuk iuran sekali bayar.', items: { $ref: '#/components/schemas/DuesCell' } }
                      once:
                        description: Sel tunggal untuk iuran sekali bayar, null untuk iuran bulanan.
                        oneOf:
                          - $ref: '#/components/schemas/DuesCell'
                          - type: 'null'
                      recent_submissions: { type: array, description: 5 bukti bayar terakhir dari rumah ini., items: { $ref: '#/components/schemas/PaymentSubmission' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payment-submissions:
    post:
      tags: [Bukti Bayar]
      summary: Kirim bukti transfer
      description: |
        Warga mengirim bukti transfer, lalu pengurus menerima atau menolaknya.
        Bulan yang sudah lunas atau sedang menunggu konfirmasi akan ditolak dengan 422 pada field `periods`.
        Untuk iuran sekali bayar, `periods` tidak perlu dikirim.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [household_id, dues_type_id, bank_account_id, proof]
              properties:
                household_id: { type: integer }
                dues_type_id: { type: integer }
                'periods[]':
                  type: array
                  maxItems: 24
                  items: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                  description: Wajib untuk iuran bulanan. Tahun harus di rentang 5 tahun lalu sampai tahun depan.
                bank_account_id: { type: integer, description: Rekening tujuan yang ditransfer warga. }
                proof: { type: string, format: binary, description: 'jpg, jpeg, png, webp, heic, atau pdf; maks 5 MB.' }
                payer_name: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 30 }
                note: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Terkirim. Simpan `data.code` untuk mengecek status nanti.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentSubmission' }
                  message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /payment-submissions/{code}:
    get:
      tags: [Bukti Bayar]
      summary: Cek bukti bayar lewat kodenya
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: K7M2QX9P, description: Tidak membedakan huruf besar/kecil. }
      responses:
        '200':
          description: Bukti bayar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentSubmission' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payments:
    get:
      tags: [Admin · Pembayaran]
      summary: Daftar pembayaran tercatat
      parameters:
        - { name: household_id, in: query, schema: { type: integer } }
        - { name: dues_type_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Pembayaran per halaman
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin · Pembayaran]
      summary: Catat pembayaran tunai/transfer
      description: |
        `amount` adalah total uang yang diterima; nilainya dibagi rata ke bulan yang dipilih (sisa pembagian masuk ke
        bulan-bulan pertama). Bulan yang sudah tercatat dilewati dan dicantumkan di `skipped`.
        Mengembalikan 201 kalau minimal satu bulan tercatat, 200 kalau semuanya dilewati.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [household_id, dues_type_id, amount, paid_on, method]
              properties:
                household_id: { type: integer }
                dues_type_id: { type: integer }
                periods: { type: array, items: { type: string, example: '2026-09' }, description: Wajib untuk iuran bulanan. }
                amount: { type: integer, minimum: 0, maximum: 100000000 }
                paid_on: { type: string, format: date, description: Hari ini atau sebelumnya. }
                method: { type: string, enum: [tunai, transfer] }
                note: { type: string, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/RecordResult' }
        '201': { $ref: '#/components/responses/RecordResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/payments/{payment}:
    delete:
      tags: [Admin · Pembayaran]
      summary: Hapus catatan pembayaran
      parameters:
        - { name: payment, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payment-submissions:
    get:
      tags: [Admin · Konfirmasi Bayar]
      summary: Daftar bukti bayar per status
      description: 'Yang menunggu diurutkan dari yang terlama; yang sudah diproses dari yang terakhir diperiksa. `counts` berisi jumlah per status untuk badge tab.'
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SubmissionStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Bukti bayar per halaman
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PaymentSubmission' } }
                      counts:
                        type: object
                        properties:
                          menunggu: { type: integer }
                          diterima: { type: integer }
                          ditolak: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/payment-submissions/{submission}:
    get:
      tags: [Admin · Konfirmasi Bayar]
      summary: Detail bukti bayar
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      responses:
        '200': { $ref: '#/components/responses/SubmissionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/payment-submissions/{submission}/proof:
    get:
      tags: [Admin · Konfirmasi Bayar]
      summary: Unduh file bukti
      description: Mengirim file gambar atau PDF yang diunggah warga. Butuh token, jadi ambil lewat HTTP client yang membawa header Authorization, bukan URL gambar biasa.
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      responses:
        '200':
          description: File bukti
          content:
            image/*: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/payment-submissions/{submission}/approve:
    post:
      tags: [Admin · Konfirmasi Bayar]
      summary: Terima (penuh atau sebagian)
      description: |
        Mencatat pembayaran untuk setiap bulan yang diterima. Kirim bulan yang diterima di `periods`; kalau lebih sedikit
        dari yang diajukan, `reject_reason` wajib diisi dan bulan sisanya kembali bisa dibayar. Iuran sekali bayar: `periods`
        tidak perlu dikirim. Bulan yang sudah tercatat tidak dicatat dobel (dicantumkan di `skipped`).
        409 kalau sudah diproses sebelumnya.
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paid_on]
              properties:
                paid_on: { type: string, format: date }
                periods: { type: array, items: { type: string } }
                reject_reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Diterima
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentSubmission' }
                  message: { type: string }
                  created: { type: array, items: { type: string }, example: [Januari 2026] }
                  skipped: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/payment-submissions/{submission}/reject:
    post:
      tags: [Admin · Konfirmasi Bayar]
      summary: Tolak
      description: Warga bisa mengirim ulang. 409 kalau sudah diproses sebelumnya.
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reject_reason]
              properties:
                reject_reason: { type: string, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/SubmissionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/payment-submissions/{submission}/cancel:
    post:
      tags: [Admin · Konfirmasi Bayar]
      summary: Batalkan penerimaan
      description: Menghapus catatan pembayaran yang dibuat saat diterima dan mengembalikan bukti bayar ke status menunggu. Hanya untuk yang sudah diterima (selain itu 409).
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      responses:
        '200':
          description: Dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentSubmission' }
                  message: { type: string }
                  removed_payments: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/payment-submissions/{submission}/reopen:
    post:
      tags: [Admin · Konfirmasi Bayar]
      summary: Buka lagi bukti yang ditolak
      description: Hanya untuk yang berstatus ditolak (selain itu 409).
      parameters: [{ $ref: '#/components/parameters/Submission' }]
      responses:
        '200': { $ref: '#/components/responses/SubmissionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/posts:
    get:
      tags: [Admin · Kabar]
      summary: Semua kabar termasuk draf
      description: Draf tampil paling atas, lalu yang terbaru terbit.
      parameters:
        - { $ref: '#/components/parameters/PostCategory' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Kabar per halaman
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Post' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin · Kabar]
      summary: Buat kabar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PostInput' }
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201': { $ref: '#/components/responses/PostResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/posts/{post}:
    parameters:
      - { name: post, in: path, required: true, schema: { type: integer }, description: ID kabar (bukan slug). }
    get:
      tags: [Admin · Kabar]
      summary: Detail kabar
      responses:
        '200': { $ref: '#/components/responses/PostResult' }
