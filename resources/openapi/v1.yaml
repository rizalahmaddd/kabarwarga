                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin · Settings & Users]
      summary: Add a committee member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 160 }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/{user}:
    delete:
      tags: [Admin · Settings & Users]
      summary: Revoke a committee member's access
      description: Also revokes their API tokens. 409 when deleting your own account.
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from `POST /auth/login`.

  parameters:
    Page:
      { name: page, in: query, schema: { type: integer, minimum: 1 } }
    PerPage:
      { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: 'Max 50 on public posts.' }
    PostCategory:
      { name: category, in: query, schema: { $ref: '#/components/schemas/PostCategory' } }
    Submission:
      { name: submission, in: path, required: true, schema: { type: integer }, description: Submission ID (not code). }

  requestBodies:
    HouseholdInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [number, head_name]
            properties:
              number: { type: string, maxLength: 30, description: 'Unique house number., example: A-7' }
              head_name: { type: string, maxLength: 100 }
              phone: { type: string, maxLength: 30 }
              note: { type: string, maxLength: 1000 }
              is_active: { type: boolean }
    DuesTypeInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, amount, frequency]
            properties:
              name: { type: string, maxLength: 100 }
              amount: { type: integer, minimum: 0, maximum: 100000000, description: Amount per period in Rupiah. }
              frequency: { $ref: '#/components/schemas/Frequency' }
              starts_on: { type: string, pattern: '^\d{4}-\d{2}$', description: 'Monthly only (YYYY-MM). Months before it are not applicable.' }
              due_on: { type: string, format: date, description: One-time only. }
              description: { type: string, maxLength: 1000 }
              is_active: { type: boolean }
    ExpenseInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [spent_on, description, amount]
            properties:
              spent_on: { type: string, format: date, description: Today or earlier. }
              description: { type: string, maxLength: 255 }
              amount: { type: integer, minimum: 1, maximum: 100000000 }
    BankAccountInput:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [bank_name]
            description: Either `account_number` or a QRIS image is required.
            properties:
              bank_name: { type: string, maxLength: 60, example: BCA }
              account_number: { type: string, maxLength: 60 }
              account_name: { type: string, maxLength: 100 }
              qris: { type: string, format: binary, description: 'Image, max 3 MB.' }
              remove_qris: { type: boolean }
              position: { type: integer, minimum: 0, maximum: 999, description: Sort order. }
              is_active: { type: boolean }

  responses:
    Message:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Unauthenticated. }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Conflict:
      description: Business rule prevents the action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: 'Rumah A-7 sudah punya catatan iuran, jadi tidak bisa dihapus. Nonaktifkan saja kalau sudah pindah.' }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    RecordResult:
      description: Recording result
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              created: { type: array, items: { type: string }, example: [Januari 2026, Februari 2026] }
              skipped: { type: array, items: { type: string } }
    SubmissionResult:
      description: Submission
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/PaymentSubmission' }
              message: { type: string }
    PostResult:
      description: Post
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Post' }
              message: { type: string }
    HouseholdResult:
      description: Household
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Household' }
              message: { type: string }
    DuesTypeResult:
      description: Dues type
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/DuesType' }
              message: { type: string }
    ExpenseResult:
      description: Expense
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Expense' }
              message: { type: string }
    BankAccountResult:
      description: Bank account
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/BankAccount' }
              message: { type: string }

  schemas:
    Message:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string, example: Centang minimal satu bulan yang dibayar. }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          example: { periods: [Centang minimal satu bulan yang dibayar.] }
    Paginated:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: ['string', 'null'] }
            last: { type: ['string', 'null'] }
            prev: { type: ['string', 'null'] }
            next: { type: ['string', 'null'] }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: ['integer', 'null'] }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: ['integer', 'null'] }
            total: { type: integer }
    Settings:
      type: object
      properties:
        site_name: { type: string, example: RT 04 Griya Asri }
        site_tagline: { type: string }
        address: { type: string }
        treasurer_contact: { type: string }
        payment_info: { type: string }
    PostCategory:
      type: string
      enum: [pengumuman, berita, kegiatan, iuran]
    Frequency:
      type: string
      enum: [bulanan, sekali]
      description: '`bulanan` = monthly, `sekali` = one-time.'
    SubmissionStatus:
      type: string
      enum: [menunggu, diterima, ditolak]
      description: '`menunggu` = pending, `diterima` = approved, `ditolak` = rejected.'
    DuesStatus:
      type: string
      enum: [paid, pending, unpaid, not_applicable]
      description: '`not_applicable` = month is before the dues type `starts_on`.'
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, description: Only for authenticated requests. }
        created_at: { type: string, format: date-time, description: Only for authenticated requests. }
    Post:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        category: { $ref: '#/components/schemas/PostCategory' }
        category_label: { type: string }
        excerpt: { type: string, description: 'Plain text, max 160 chars.' }
        body: { type: string, description: Markdown source. }
        body_html: { type: string, description: 'Rendered, HTML-escaped Markdown.' }
        image_url: { type: ['string', 'null'] }
        popup_image_url: { type: ['string', 'null'] }
        event_starts_at: { type: ['string', 'null'], format: date-time }
        event_location: { type: ['string', 'null'] }
        is_pinned: { type: boolean }
        is_popup: { type: boolean }
        is_published: { type: boolean }
        published_at: { type: ['string', 'null'], format: date-time }
        author: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PostInput:
      type: object
      required: [title, category, body, action]
      properties:
        title: { type: string, maxLength: 160 }
        category: { $ref: '#/components/schemas/PostCategory' }
        body: { type: string, maxLength: 20000, description: Markdown. }
        action: { type: string, enum: [publish, draft], description: '`draft` unpublishes; `publish` keeps the original publish time if already published.' }
        event_starts_at: { type: string, format: date-time, description: Required when category is `kegiatan`. }
        event_location: { type: string, maxLength: 160 }
        is_pinned: { type: boolean }
        is_popup: { type: boolean }
        image: { type: string, format: binary, description: 'Image, max 3 MB (multipart only).' }
        remove_image: { type: boolean }
        popup_image: { type: string, format: binary, description: 'Image, max 4 MB (multipart only).' }
        remove_popup_image: { type: boolean }
    Household:
      type: object
      properties:
        id: { type: integer }
        number: { type: string, example: A-7 }
        head_name: { type: string, example: Pak Budi }
        label: { type: string, example: A-7 · Pak Budi }
        is_active: { type: boolean }
        phone: { type: ['string', 'null'], description: Admin only. }
        note: { type: ['string', 'null'], description: Admin only. }
        payments_count: { type: integer, description: Admin list/detail only. }
    DuesType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: Iuran Keamanan }
        amount: { type: integer, example: 25000 }
        frequency: { $ref: '#/components/schemas/Frequency' }
        is_monthly: { type: boolean }
        starts_on: { type: ['string', 'null'], example: '2026-01', description: YYYY-MM }
        due_on: { type: ['string', 'null'], format: date }
        description: { type: ['string', 'null'] }
        is_active: { type: boolean }
        payments_count: { type: integer, description: Admin only. }
        payments_sum_amount: { type: integer, description: Admin only. }
    BankAccount:
      type: object
      properties:
        id: { type: integer }
        bank_name: { type: string, example: BCA }
        account_number: { type: ['string', 'null'] }
        account_name: { type: ['string', 'null'] }
        label: { type: string, example: BCA · 1234567890 }
        qris_url: { type: ['string', 'null'] }
        is_active: { type: boolean }
        position: { type: integer }
    Expense:
      type: object
      properties:
        id: { type: integer }
        spent_on: { type: string, format: date }
        description: { type: string }
        amount: { type: integer }
        recorder: { $ref: '#/components/schemas/User' }
    Payment:
      type: object
      properties:
        id: { type: integer }
        household_id: { type: integer }
        dues_type_id: { type: integer }
        period: { type: ['string', 'null'], example: '2026-09' }
        period_label: { type: string, example: September 2026 }
        amount: { type: integer }
        paid_on: { type: string, format: date }
        method: { type: string, enum: [tunai, transfer] }
        method_label: { type: string }
        note: { type: ['string', 'null'], description: Admin only. }
        payment_submission_id: { type: ['integer', 'null'], description: Admin only. }
        household: { $ref: '#/components/schemas/Household' }
        dues_type: { $ref: '#/components/schemas/DuesType' }
        recorder: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }
    DuesCell:
      type: object
      properties:
        period: { type: ['string', 'null'], example: '2026-09' }
        period_label: { type: string, example: September 2026 }
        status: { $ref: '#/components/schemas/DuesStatus' }
        payment:
          oneOf:
            - $ref: '#/components/schemas/Payment'
            - type: 'null'
    PaymentSubmission:
      type: object
      properties:
        id: { type: integer, description: Admin only. }
        code: { type: string, example: K7M2QX9P }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        status_label: { type: string }
        is_one_time: { type: boolean }
        periods: { type: array, items: { type: string } }
        periods_label: { type: string, example: 'Jan 2026, Feb 2026' }
        approved_periods: { type: ['array', 'null'], items: { type: string } }
        declined_periods: { type: array, items: { type: string }, description: Months not accepted in a partial approval. }
        is_partial: { type: boolean }
        unit_amount: { type: integer }
        total: { type: integer }
        accepted_total: { type: integer }
        payer_name: { type: ['string', 'null'] }
        phone: { type: ['string', 'null'], description: Admin only. }
        note: { type: ['string', 'null'] }
        reject_reason: { type: ['string', 'null'] }
        reviewed_at: { type: ['string', 'null'], format: date-time }
        proof_url: { type: string, description: Admin only. Requires the bearer token. }
        household: { $ref: '#/components/schemas/Household' }
        dues_type: { $ref: '#/components/schemas/DuesType' }
        bank_account: { $ref: '#/components/schemas/BankAccount' }
        reviewer: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }
